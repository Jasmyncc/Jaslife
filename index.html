<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7d9b83">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jaslife">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <title>Jaslife</title>
  <style>
    :root{--cream:#f7f0e6;--paper:#fffaf3;--sage:#8c5a3c;--sage-light:#efe0cf;--apricot:#c97b4b;--ink:#3f2d25;--muted:#8e7768;--line:#e7d7c5;--red:#ad5d48}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(150deg,#f9f3eb 0%,#f3e8da 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom));max-width:600px;margin:auto}
    header{padding:25px 5px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e9dccc;margin-bottom:19px} h1{font-family:Georgia,"Songti SC",serif;font-size:32px;margin:0;letter-spacing:.2px;font-weight:600} .date{font-size:13px;color:var(--muted);margin-top:5px}.hello{font-size:12px;color:#71462f;background:#f2dfcb;border-radius:8px;padding:8px 10px;max-width:155px;line-height:1.35;text-align:center;font-weight:600}
    .tab{display:none}.tab.active{display:block}.hero{background:linear-gradient(135deg,#8d5b3e,#70432f);color:#fffaf3;border-radius:14px;padding:22px;margin:0 0 16px;box-shadow:0 8px 22px #6e3e281c}.hero small{opacity:.85}.hero strong{display:block;font-size:31px;margin:6px 0}.progress{height:8px;background:#ffffff48;border-radius:10px;overflow:hidden}.progress i{display:block;background:#ffe1c7;height:100%;border-radius:10px}
    .today-intro{display:flex;justify-content:space-between;align-items:center;padding:1px 4px 17px}.eyebrow{font-size:12px;color:var(--sage);font-weight:700;letter-spacing:1px}.today-intro h2{font-family:Georgia,"Songti SC",serif;font-size:25px;margin:5px 0;font-weight:600}.today-intro p{font-size:13px;color:var(--muted);margin:0}.sun{font-size:30px;background:#efd7bd;border-radius:12px;width:54px;height:54px;text-align:center;line-height:54px}.hero-top,.section-head,.note-title{display:flex;justify-content:space-between;align-items:center}.hero-top span{font-size:12px;color:#fff0df}.quick-wrap{margin:20px 1px}.quick-title{font-size:16px;font-weight:700;margin-bottom:10px}.quick-title span{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}.quick-add{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick-add button{border:1px solid #eadbc9;border-radius:10px;padding:12px 3px 9px;background:var(--paper);color:var(--sage);font-size:21px;box-shadow:none}.quick-add small{display:block;font-size:11px;color:var(--ink);margin-top:4px}.section-head{margin-top:24px}.section-head .section-title{margin:0 2px 12px}.section-head>span{font-size:11px;color:var(--muted)}.text-link{border:0;background:transparent;color:var(--sage);font-size:12px;padding:0 2px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--paper);border:1px solid #eadbc9;border-radius:12px;padding:17px;box-shadow:0 4px 13px #5c36200a}.card b{font-size:22px;display:block;margin:7px 0 2px}.label{font-size:12px;color:var(--muted)}.metrics{gap:10px}.metric{display:flex;align-items:center;gap:10px;padding:14px}.metric b{font-size:17px;margin:3px 0}.metric-icon{width:31px;height:31px;border-radius:9px;background:var(--sage-light);color:var(--sage);display:grid;place-items:center;font-size:16px}.expense-card .metric-icon{background:#f4dfc9;color:#a55d36}.study-card .metric-icon{background:#eee0d2;color:#805c43}.note{grid-column:1/-1;background:#faead8}.home-note{margin-top:12px}.note-title{font-size:13px;font-weight:700}.note-title span:last-child{font-size:11px;color:var(--muted);font-weight:400}.note p{margin:8px 0 0;line-height:1.6;font-size:14px}.section-title{font-size:18px;margin:24px 2px 12px}.empty{font-size:14px;color:var(--muted);line-height:1.7;text-align:center;padding:27px 10px}.row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:13px 2px}.row:last-child{border-bottom:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--apricot);flex:none}.row-main{flex:1;font-size:15px}.row small{display:block;color:var(--muted);margin-top:4px}.check{width:22px;height:22px;border:2px solid #cbdacb;border-radius:50%;appearance:none;background:white}.check:checked{background:var(--sage);box-shadow:inset 0 0 0 4px white}.amount{font-weight:600}.income{color:var(--sage)}.expense{color:var(--red)}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);background:#fffaf3f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:4}.nav-btn{border:0;background:none;color:var(--muted);font-size:11px;padding:7px 4px;min-width:48px}.nav-btn span{display:block;font-size:19px;margin-bottom:2px}.nav-btn.active{color:var(--sage);font-weight:700}.add{width:53px;height:53px;border-radius:50%;border:0;background:#9a5b3c;color:white;font-size:30px;line-height:1;box-shadow:0 4px 13px #8f543344;margin-top:-28px}
    dialog{border:0;border-radius:24px;width:min(91vw,420px);padding:22px;background:#fffdf9;box-shadow:0 18px 50px #4b3b2b44}dialog::backdrop{background:#4f5f5044}dialog h2{margin:0 0 16px}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.type{border:1px solid var(--line);background:white;border-radius:14px;padding:12px;text-align:left;color:var(--ink)}.type.selected{border-color:var(--sage);background:var(--sage-light)}label{font-size:13px;color:var(--muted);display:block;margin-top:12px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit;margin-top:5px}textarea{resize:vertical;min-height:75px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:17px}.actions button{border:0;border-radius:12px;padding:11px 16px;font:inherit}.cancel{background:#f1eee8;color:var(--ink)}.save{background:var(--sage);color:white}
  </style>
</head>
<body>
<header><div><h1>Jaslife</h1><div class="date" id="date"></div></div><div class="hello">姜姜你是全世界最厉害的人！</div></header>
<main>
<section class="tab active" id="home">
  <div class="today-intro"><div><span class="eyebrow">今日生活簿</span><h2 id="greeting">早安，Jasmyn</h2><p>不必面面俱到，完成一件小事就很棒。</p></div><span class="sun">☀</span></div>
  <div class="hero"><div class="hero-top"><small>今日待办进度</small><span id="todoPercent">准备开始</span></div><strong id="todoStat">0 / 0 已完成</strong><div class="progress"><i id="progress" style="width:0%"></i></div></div>
  <div class="quick-wrap"><div class="quick-title">快速记录 <span>把此刻轻轻放进生活里</span></div><div class="quick-add" id="quickAdd"><button data-quick="todo">✓<small>待办</small></button><button data-quick="study">◌<small>学习</small></button><button data-quick="expense">¥<small>支出</small></button><button data-quick="note">✎<small>随手记</small></button></div></div>
  <div class="section-head"><h2 class="section-title">今天的状态</h2><span>慢慢积累</span></div>
  <div class="grid metrics">
    <div class="card metric study-card"><span class="metric-icon">◌</span><div><div class="label">学习时长</div><b id="studyStat">0 分钟</b></div></div>
    <div class="card metric expense-card"><span class="metric-icon">¥</span><div><div class="label">今日花销</div><b id="expenseStat">¥0.00</b></div></div>
    <div class="card metric"><span class="metric-icon">♥</span><div><div class="label">今日运动</div><b id="exerciseStat">0 分钟</b></div></div>
    <div class="card metric"><span class="metric-icon">⌁</span><div><div class="label">当前体重</div><b id="weightStat">— kg</b></div></div>
  </div>
  <div class="card note home-note"><div class="note-title"><span>✦ 随手记</span><span>此刻的心情</span></div><p id="noteStat">今天也值得被认真记住。</p></div>
  <div class="section-head"><h2 class="section-title">接下来要做</h2><button class="text-link" data-tab="todos">全部待办 →</button></div><div class="card" id="todayTodos"></div>
</section>
<section class="tab" id="todos"><h2 class="section-title">待办清单</h2><div class="card" id="todoList"></div></section>
<section class="tab" id="study"><h2 class="section-title">学习记录</h2><div class="card" id="studyList"></div></section>
<section class="tab" id="fitness"><h2 class="section-title">健身与体重</h2><div class="card" id="fitnessList"></div></section>
<section class="tab" id="money"><h2 class="section-title">记账本</h2><div class="card" id="moneyList"></div></section>
</main>
<nav>
<button class="nav-btn active" data-tab="home"><span>⌂</span>首页</button><button class="nav-btn" data-tab="todos"><span>✓</span>待办</button><button class="nav-btn" data-tab="study"><span>◌</span>学习</button><button class="add" id="openAdd" aria-label="新增">＋</button><button class="nav-btn" data-tab="fitness"><span>♥</span>健身</button><button class="nav-btn" data-tab="money"><span>¥</span>记账</button>
</nav>
<dialog id="dialog"><form method="dialog"><h2>记录一点生活</h2><div class="types" id="types"></div><label>内容<input id="entryText" placeholder="例如：完成英语阅读"></label><label id="valueLabel">数值（可选）<input id="entryValue" type="number" step="0.1" placeholder="例如：30"></label><div class="actions"><button class="cancel" value="cancel">取消</button><button class="save" id="saveEntry" value="default">保存</button></div></form></dialog>
<script>
$('#greeting').textContent=(new Date().getHours()<11?'早安':new Date().getHours()<18?'午安':'晚上好')+'，Jasmyn';const key='jaslife-data-v1',types=[['todo','待办','要做的事'],['study','学习','学习内容'],['exercise','运动','运动内容'],['weight','体重','当前体重'],['expense','支出','支出项目'],['income','收入','收入来源'],['note','备忘录','想记下的话']];
let data=JSON.parse(localStorage.getItem(key)||'{"items":[]}'),chosen='todo';const $=s=>document.querySelector(s),day=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#date').textContent=day;
function save(){localStorage.setItem(key,JSON.stringify(data));render()} function today(x){return new Date(x.time).toDateString()===new Date().toDateString()} function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function list(items,el,kind){el.innerHTML=items.length?items.map(x=>'<div class="row">'+(kind==='todo'?'<input class="check" data-id="'+x.id+'" type="checkbox" '+(x.done?'checked':'')+'>':'<i class="dot"></i>')+'<div class="row-main">'+esc(x.text)+'<small>'+new Date(x.time).toLocaleDateString('zh-CN')+(x.value?' · '+x.value+(kind==='weight'?' kg':kind==='study'||kind==='exercise'?' 分钟':' 元'):'')+'</small></div>'+(kind==='expense'?'<span class="amount expense">−¥'+Number(x.value||0).toFixed(2)+'</span>':kind==='income'?'<span class="amount income">+¥'+Number(x.value||0).toFixed(2)+'</span>':'')+'</div>').join(''):'<div class="empty">还没有记录。点击下方 ＋，从一件小事开始吧。</div>'}
function render(){const a=data.items,td=a.filter(x=>x.type==='todo'&&today(x)),done=td.filter(x=>x.done).length;$('#todoStat').textContent=done+' / '+td.length+' 已完成';let pct=td.length?Math.round(done/td.length*100):0;$('#progress').style.width=pct+'%';$('#todoPercent').textContent=td.length?(pct===100?'今日完成啦！':pct+'% 完成'):'准备开始';$('#studyStat').textContent=a.filter(x=>x.type==='study'&&today(x)).reduce((n,x)=>n+Number(x.value||0),0)+' 分钟';let w=a.filter(x=>x.type==='weight').at(-1);$('#weightStat').textContent=w?(w.value+' kg'):'— kg';$('#expenseStat').textContent='¥'+a.filter(x=>x.type==='expense'&&today(x)).reduce((n,x)=>n+Number(x.value||0),0).toFixed(2);$('#exerciseStat').textContent=a.filter(x=>x.type==='exercise'&&today(x)).reduce((n,x)=>n+Number(x.value||0),0)+' 分钟';let n=a.filter(x=>x.type==='note').at(-1);$('#noteStat').textContent=n?n.text:'今天也值得被认真记住。';list(td.filter(x=>!x.done),$('#todayTodos'),'todo');list(a.filter(x=>x.type==='todo'),$('#todoList'),'todo');list(a.filter(x=>x.type==='study'),$('#studyList'),'study');list(a.filter(x=>['exercise','weight'].includes(x.type)),$('#fitnessList'),'fitness');list(a.filter(x=>['expense','income'].includes(x.type)),$('#moneyList'),'money')}
$('#types').innerHTML=types.map(t=>'<button class="type '+(t[0]===chosen?'selected':'')+'" type="button" data-type="'+t[0]+'">'+t[1]+'</button>').join('');
$('#types').onclick=e=>{let b=e.target.closest('.type');if(!b)return;chosen=b.dataset.type;document.querySelectorAll('.type').forEach(x=>x.classList.toggle('selected',x===b));let t=types.find(x=>x[0]===chosen);$('#entryText').placeholder=t[2];$('#valueLabel').style.display=['study','exercise','weight','expense','income'].includes(chosen)?'block':'none'};
function openAdd(type){$('#entryText').value='';$('#entryValue').value='';if(type){let b=document.querySelector('.type[data-type="'+type+'"]');if(b)b.click()}$('#dialog').showModal()} $('#openAdd').onclick=()=>openAdd();$('#quickAdd').onclick=e=>{let b=e.target.closest('[data-quick]');if(b)openAdd(b.dataset.quick)};document.querySelector('.text-link').onclick=()=>document.querySelector('.nav-btn[data-tab="todos"]').click();$('#saveEntry').onclick=e=>{let text=$('#entryText').value.trim(),v=$('#entryValue').value;if(!text&&chosen!=='weight'){e.preventDefault();$('#entryText').focus();return}data.items.push({id:Date.now(),type:chosen,text:text||(chosen==='weight'?'体重记录':''),value:v,time:Date.now(),done:false});save()};document.addEventListener('change',e=>{if(e.target.matches('.check')){let x=data.items.find(x=>x.id==e.target.dataset.id);x.done=e.target.checked;save()}});
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
