<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8c5a3c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Jaslife">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon.svg"><title>Jaslife</title>
<style>
:root{--bg:#f7f0e6;--paper:#fffaf3;--ink:#3f2d25;--muted:#8e7768;--primary:#8c5a3c;--primary2:#70432f;--soft:#efe0cf;--accent:#c97b4b;--red:#ad5d48;--green:#698166;--line:#e7d7c5;--shadow:0 8px 25px #603b2512}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f9f3eb,#f3e8da);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom));max-width:620px;margin:auto}button,input,select,textarea{font:inherit}button{cursor:pointer}.app-head{padding:22px 4px 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:18px}.brand{font-family:Georgia,"Songti SC",serif;font-size:31px;font-weight:600;letter-spacing:.2px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.love{font-size:11px;color:#71462f;background:#f2dfcb;border-radius:8px;padding:8px 10px;line-height:1.35;max-width:150px;text-align:center;font-weight:600}.view{display:none}.view.active{display:block}.intro{padding:1px 4px 17px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;color:var(--primary);font-weight:700;letter-spacing:1px}.intro h1{font-family:Georgia,"Songti SC",serif;font-size:25px;margin:5px 0}.intro p{font-size:13px;color:var(--muted);margin:0}.sun{font-size:30px;background:#efd7bd;border-radius:12px;width:54px;height:54px;display:grid;place-items:center}.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fffaf3;border-radius:14px;padding:21px;box-shadow:var(--shadow)}.hero-top,.section-head,.list-top,.modal-head{display:flex;justify-content:space-between;align-items:center}.hero small{opacity:.86}.hero strong{display:block;font-size:30px;margin:7px 0}.hero-top span{font-size:12px;color:#f9ddc3}.progress{height:7px;border-radius:9px;background:#ffffff46;overflow:hidden}.progress i{height:100%;display:block;background:#f9d4b6;border-radius:9px;transition:.3s}.quick-title{font-size:16px;font-weight:700;margin:20px 1px 10px}.quick-title span{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{border:1px solid var(--line);background:var(--paper);border-radius:10px;color:var(--primary);font-size:20px;padding:11px 2px 8px}.quick small{display:block;font-size:11px;color:var(--ink);margin-top:4px}.section-head{margin-top:24px}.section-head h2{font-size:18px;margin:0 2px 11px}.section-head span{font-size:11px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{display:flex;align-items:center;gap:10px;padding:14px}.metric-icon{width:31px;height:31px;border-radius:9px;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-size:16px}.metric b{font-size:17px;display:block;margin:3px 0}.label{font-size:12px;color:var(--muted)}.note{background:#faead8;margin-top:11px}.note-title{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.note-title span:last-child{font-size:11px;color:var(--muted);font-weight:400}.note p{font-size:14px;line-height:1.6;margin:8px 0 0}.mini-bars{height:75px;display:flex;align-items:end;gap:7px;padding:10px 2px 0}.bar{flex:1;background:#e9d4bd;border-radius:5px 5px 0 0;min-height:4px;position:relative}.bar i{font-style:normal;position:absolute;bottom:-19px;font-size:10px;color:var(--muted);left:50%;transform:translateX(-50%)}.bar.today{background:var(--primary)}.list-card{padding:3px 15px}.empty{text-align:center;color:var(--muted);line-height:1.7;font-size:14px;padding:30px 10px}.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.row:last-child{border-bottom:0}.check{appearance:none;width:22px;height:22px;border:2px solid #c9b4a1;border-radius:50%;flex:none;background:white}.check:checked{background:var(--green);box-shadow:inset 0 0 0 4px white}.type-icon{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}.row-main{flex:1;min-width:0}.row-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.done .row-title{text-decoration:line-through;color:var(--muted)}.row-meta{font-size:11px;color:var(--muted);margin-top:4px}.row-value{font-size:13px;font-weight:700;white-space:nowrap}.income{color:var(--green)}.expense{color:var(--red)}.more{border:0;background:none;color:var(--muted);font-size:20px;padding:0 1px}.filters{display:flex;gap:7px;overflow:auto;padding:0 0 11px}.filters button{white-space:nowrap;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:20px;font-size:12px;padding:7px 11px}.filters button.active{background:var(--primary);border-color:var(--primary);color:white}.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;color:var(--ink);margin-bottom:11px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.summary .card{text-align:center;padding:13px 6px}.summary b{font-size:16px;display:block;margin-top:5px}.manage button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:13px;width:100%;text-align:left;color:var(--ink);margin-bottom:8px}.manage small{display:block;color:var(--muted);margin-top:3px}.danger{color:var(--red)!important}.text-link{border:0;background:none;color:var(--primary);font-size:12px;padding:0 2px 11px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);background:#fffaf3f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 9px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:4}.nav-btn{border:0;background:none;color:var(--muted);font-size:11px;padding:7px 3px;min-width:45px}.nav-btn span{display:block;font-size:18px;margin-bottom:2px}.nav-btn.active{color:var(--primary);font-weight:700}.add{width:53px;height:53px;border-radius:50%;border:0;background:#9a5b3c;color:white;font-size:30px;line-height:1;box-shadow:0 4px 13px #8f543344;margin-top:-28px}dialog{border:0;border-radius:16px;background:var(--paper);padding:20px;width:min(92vw,430px);color:var(--ink);box-shadow:0 18px 50px #4b2e2044}dialog::backdrop{background:#40291f66}.modal-head h2{font-family:Georgia,"Songti SC",serif;font-size:22px;margin:0}.close{border:0;background:none;color:var(--muted);font-size:25px}label{display:block;font-size:12px;color:var(--muted);margin-top:12px}input,select,textarea{width:100%;border:1px solid var(--line);background:white;color:var(--ink);padding:11px;border-radius:9px;margin-top:5px}textarea{min-height:74px;resize:vertical}.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.type-grid button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;font-size:11px;padding:9px 2px}.type-grid button.selected{background:var(--soft);border-color:var(--primary);color:var(--primary);font-weight:700}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.actions button{border:0;border-radius:9px;padding:10px 15px}.cancel{background:#eee4d8;color:var(--ink)}.save{background:var(--primary);color:white}.toast{position:fixed;top:calc(15px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#3f2d25;color:white;padding:10px 15px;border-radius:9px;font-size:13px;z-index:10;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.hidden{display:none!important}
</style></head>
<body>
<header class="app-head"><div><div class="brand">Jaslife</div><div class="sub" id="dateText"></div></div><div class="love">姜姜你是全世界最厉害的人！</div></header>
<main>
<section class="view active" id="home"><div class="intro"><div><span class="eyebrow">今日生活簿</span><h1 id="greeting">早安，Jasmyn</h1><p>不必面面俱到，完成一件小事就很棒。</p></div><span class="sun">☀</span></div><div class="hero"><div class="hero-top"><small>今日待办进度</small><span id="percentText">准备开始</span></div><strong id="todoStat">0 / 0 已完成</strong><div class="progress"><i id="progress"></i></div></div><div class="quick-title">快速记录 <span>把此刻轻轻放进生活里</span></div><div class="quick" id="quick"><button data-type="todo">✓<small>待办</small></button><button data-type="study">◌<small>学习</small></button><button data-type="expense">¥<small>支出</small></button><button data-type="note">✎<small>随手记</small></button></div><div class="section-head"><h2>今天的状态</h2><span>慢慢积累</span></div><div class="metrics"><div class="card metric"><i class="metric-icon">◌</i><div><span class="label">学习时长</span><b id="studyStat">0 分钟</b></div></div><div class="card metric"><i class="metric-icon">¥</i><div><span class="label">今日花销</span><b id="expenseStat">¥0.00</b></div></div><div class="card metric"><i class="metric-icon">♥</i><div><span class="label">今日运动</span><b id="exerciseStat">0 分钟</b></div></div><div class="card metric"><i class="metric-icon">⌁</i><div><span class="label">当前体重</span><b id="weightStat">— kg</b></div></div></div><div class="card note"><div class="note-title"><span>✦ 随手记</span><span>此刻的心情</span></div><p id="noteStat">今天也值得被认真记住。</p></div><div class="section-head"><h2>接下来要做</h2><button class="text-link" data-go="todo">全部待办 →</button></div><div class="card list-card" id="todayTodos"></div><div class="section-head"><h2>本周学习</h2><span id="weekStudy">0 分钟</span></div><div class="card"><div class="mini-bars" id="bars"></div></div></section>
<section class="view" id="todo"><div class="section-head"><h2>待办清单</h2><span id="todoCount"></span></div><div class="filters" id="todoFilters"><button class="active" data-filter="all">全部</button><button data-filter="today">今天</button><button data-filter="open">未完成</button><button data-filter="done">已完成</button></div><input class="search" id="todoSearch" placeholder="搜索待办"><div class="card list-card" id="todoList"></div></section>
<section class="view" id="study"><div class="section-head"><h2>学习记录</h2><span id="studyTotal"></span></div><div class="summary" id="studySummary"></div><div class="card list-card" id="studyList"></div></section>
<section class="view" id="fitness"><div class="section-head"><h2>健身与体重</h2><span>照顾好自己</span></div><div class="summary" id="fitnessSummary"></div><div class="card list-card" id="fitnessList"></div></section>
<section class="view" id="money"><div class="section-head"><h2>记账本</h2><span id="moneyMonth"></span></div><div class="summary" id="moneySummary"></div><div class="filters" id="moneyFilters"><button class="active" data-filter="all">全部</button><button data-filter="expense">支出</button><button data-filter="income">收入</button></div><div class="card list-card" id="moneyList"></div></section>
<section class="view" id="settings"><div class="section-head"><h2>我的数据</h2><span>只保存在本机</span></div><div class="card manage"><button id="exportBtn">导出备份 <small>下载一份 Jaslife 数据文件，可用于换机恢复</small></button><button id="importBtn">导入备份 <small>从之前导出的文件恢复记录</small></button><button id="clearBtn" class="danger">清空全部记录 <small>此操作不可撤销，请先导出备份</small></button></div><input class="hidden" type="file" id="importFile" accept="application/json"><div class="card note"><div class="note-title"><span>隐私说明</span></div><p>Jaslife 不需要账户，所有记录只存在这台设备的浏览器中，不会上传到服务器。</p></div></section>
</main>
<nav><button class="nav-btn active" data-view="home"><span>⌂</span>首页</button><button class="nav-btn" data-view="todo"><span>✓</span>待办</button><button class="nav-btn" data-view="study"><span>◌</span>学习</button><button class="add" id="addBtn" aria-label="新增">＋</button><button class="nav-btn" data-view="fitness"><span>♥</span>健身</button><button class="nav-btn" data-view="money"><span>¥</span>记账</button><button class="nav-btn" data-view="settings"><span>⚙</span>设置</button></nav>
<dialog id="entryDialog"><form id="entryForm"><div class="modal-head"><h2 id="dialogTitle">新增记录</h2><button class="close" type="button" id="closeDialog">×</button></div><div class="type-grid" id="typeGrid"></div><label>内容<textarea id="title" placeholder="写下这一刻…"></textarea></label><div class="form-row"><label id="valueWrap">数值<input id="value" type="number" step="0.1" placeholder="例如 30"></label><label>日期<input id="entryDate" type="date"></label></div><label id="categoryWrap">分类<select id="category"></select></label><div class="actions"><button type="button" class="cancel" id="cancelDialog">取消</button><button class="save">保存</button></div></form></dialog>
<div class="toast" id="toast"></div>
<script>
const KEY='jaslife-data-v2',oldKey='jaslife-data-v1';
const TYPES={todo:{name:'待办',icon:'✓',cats:['生活','工作','学习','健康','其他']},study:{name:'学习',icon:'◌',cats:['阅读','课程','语言','技能','其他'],unit:'分钟'},exercise:{name:'运动',icon:'♥',cats:['跑步','力量','瑜伽','散步','其他'],unit:'分钟'},weight:{name:'体重',icon:'⌁',cats:['体重'],unit:'kg'},expense:{name:'支出',icon:'¥',cats:['餐饮','交通','购物','居住','娱乐','其他'],unit:'元'},income:{name:'收入',icon:'＋',cats:['工资','副业','礼物','退款','其他'],unit:'元'},note:{name:'备忘录',icon:'✎',cats:['日常','灵感','心情','重要'],note:true}};
let state=load(),formType='todo',editingId=null,todoFilter='all',moneyFilter='all';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.items))return d;let old=JSON.parse(localStorage.getItem(oldKey)||'{"items":[]}');return {items:(old.items||[]).map(x=>({id:x.id||Date.now()+Math.random(),type:x.type,title:x.title||x.text||'',value:x.value||'',category:x.category||'',date:x.date||dateISO(x.time||Date.now()),created:x.created||x.time||Date.now(),done:!!x.done}))}}catch{return{items:[]}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function dateISO(v=Date.now()){let d=new Date(v),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function today(x){return x.date===dateISO()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function sum(a){return a.reduce((n,x)=>n+Number(x.value||0),0)}function recent(type){return state.items.filter(x=>x.type===type).sort((a,b)=>b.created-a.created)}
function fmtDate(x){let d=new Date(x+'T00:00:00');return d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'})}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function row(x,opts={}){let t=TYPES[x.type],value=x.value!==''&&x.value!=null?(x.type==='expense'?'<span class="row-value expense">−¥'+Number(x.value).toFixed(2)+'</span>':x.type==='income'?'<span class="row-value income">+¥'+Number(x.value).toFixed(2)+'</span>':'<span class="row-value">'+esc(x.value)+(t.unit?' '+t.unit:'')+'</span>'):'',check=x.type==='todo'?'<input class="check" data-toggle="'+x.id+'" type="checkbox" '+(x.done?'checked':'')+'>':'<i class="type-icon">'+t.icon+'</i>';return '<div class="row '+(x.done?'done':'')+'">'+check+'<div class="row-main"><div class="row-title">'+esc(x.title||t.name)+'</div><div class="row-meta">'+fmtDate(x.date)+(x.category?' · '+esc(x.category):'')+'</div></div>'+value+'<button class="more" data-edit="'+x.id+'" aria-label="编辑">···</button></div>'}
function renderList(el,items,msg){el.innerHTML=items.length?items.sort((a,b)=>b.created-a.created).map(row).join(''):'<div class="empty">'+msg+'</div>'}
function render(){let a=state.items,td=a.filter(x=>x.type==='todo'&&today(x)),done=td.filter(x=>x.done).length,pct=td.length?Math.round(done/td.length*100):0;$('#todoStat').textContent=done+' / '+td.length+' 已完成';$('#percentText').textContent=td.length?(pct===100?'今日完成啦！':pct+'% 完成'):'准备开始';$('#progress').style.width=pct+'%';$('#studyStat').textContent=sum(a.filter(x=>x.type==='study'&&today(x)))+' 分钟';$('#expenseStat').textContent='¥'+sum(a.filter(x=>x.type==='expense'&&today(x))).toFixed(2);$('#exerciseStat').textContent=sum(a.filter(x=>x.type==='exercise'&&today(x)))+' 分钟';let w=recent('weight')[0];$('#weightStat').textContent=w?w.value+' kg':'— kg';let note=recent('note')[0];$('#noteStat').textContent=note?note.title:'今天也值得被认真记住。';renderList($('#todayTodos'),td.filter(x=>!x.done),'今天暂时没有待办，给自己一点轻松的空白。');renderTodos();renderStudy();renderFitness();renderMoney();renderBars()}
function renderTodos(){let a=state.items.filter(x=>x.type==='todo'),q=$('#todoSearch').value.trim().toLowerCase();if(todoFilter==='today')a=a.filter(today);if(todoFilter==='open')a=a.filter(x=>!x.done);if(todoFilter==='done')a=a.filter(x=>x.done);if(q)a=a.filter(x=>x.title.toLowerCase().includes(q));$('#todoCount').textContent=state.items.filter(x=>x.type==='todo'&&!x.done).length+' 项未完成';renderList($('#todoList'),a,'还没有待办。点 ＋ 写下今天最重要的一件事。')}
function renderStudy(){let a=state.items.filter(x=>x.type==='study'),week=lastDays(7);$('#studyTotal').textContent='累计 '+sum(a)+' 分钟';$('#studySummary').innerHTML=summaryCard('今天',sum(a.filter(today)),'分钟')+summaryCard('本周',sum(a.filter(x=>week.includes(x.date))),'分钟')+summaryCard('记录',a.length,'次');renderList($('#studyList'),a,'还没有学习记录，任何一点积累都算数。')}
function renderFitness(){let ex=state.items.filter(x=>x.type==='exercise'),w=recent('weight')[0];$('#fitnessSummary').innerHTML=summaryCard('今日运动',sum(ex.filter(today)),'分钟')+summaryCard('运动记录',ex.length,'次')+summaryCard('当前体重',w?w.value:'—','kg');renderList($('#fitnessList'),state.items.filter(x=>x.type==='exercise'||x.type==='weight'),'还没有记录，先从一次散步开始。')}
function renderMoney(){let a=state.items.filter(x=>x.type==='expense'||x.type==='income'),month=dateISO().slice(0,7),m=a.filter(x=>x.date.startsWith(month));$('#moneyMonth').textContent=new Date().toLocaleDateString('zh-CN',{month:'long'});$('#moneySummary').innerHTML=summaryCard('本月支出',sum(m.filter(x=>x.type==='expense')).toFixed(0),'元')+summaryCard('本月收入',sum(m.filter(x=>x.type==='income')).toFixed(0),'元')+summaryCard('本月结余',(sum(m.filter(x=>x.type==='income'))-sum(m.filter(x=>x.type==='expense'))).toFixed(0),'元');if(moneyFilter!=='all')a=a.filter(x=>x.type===moneyFilter);renderList($('#moneyList'),a,'还没有账目，温柔地记录每一笔。')}
function summaryCard(l,v,u){return '<div class="card"><span class="label">'+l+'</span><b>'+v+(u?' '+u:'')+'</b></div>'}
function lastDays(n){return Array.from({length:n},(_,i)=>dateISO(Date.now()-(n-1-i)*864e5))}
function renderBars(){let ds=lastDays(7),values=ds.map(d=>sum(state.items.filter(x=>x.type==='study'&&x.date===d))),max=Math.max(...values,1);$('#weekStudy').textContent=sum(values)+' 分钟';$('#bars').innerHTML=values.map((v,i)=>'<div class="bar '+(i===6?'today':'')+'" style="height:'+Math.max(8,Math.round(v/max*100))+'%"><i>'+new Date(ds[i]+'T00:00:00').getDate()+'</i></div>').join('')}
function openEntry(type='todo',item=null){formType=type;editingId=item?.id||null;$('#dialogTitle').textContent=item?'编辑记录':'新增记录';$('#title').value=item?.title||'';$('#value').value=item?.value??'';$('#entryDate').value=item?.date||dateISO();$('#typeGrid').innerHTML=Object.entries(TYPES).map(([k,t])=>'<button type="button" data-form-type="'+k+'" class="'+(k===type?'selected':'')+'">'+t.icon+'<br>'+t.name+'</button>').join('');updateForm(item?.category);$('#entryDialog').showModal()}
function updateForm(selected=''){let t=TYPES[formType],needs=!t.note&&formType!=='todo';$('#valueWrap').classList.toggle('hidden',!needs);$('#categoryWrap').classList.toggle('hidden',formType==='weight');$('#title').placeholder=t.note?'写下这一刻…':formType==='weight'?'可选，例如晨起体重':t.name+'内容';$('#category').innerHTML=t.cats.map(c=>'<option '+(c===selected?'selected':'')+'>'+c+'</option>').join('')}
function saveEntry(e){e.preventDefault();let t=TYPES[formType],title=$('#title').value.trim(),val=$('#value').value;if(formType==='weight'&&!val){toast('请填写体重数值');return}if(formType!=='weight'&&!title){toast('请填写内容');return}let d={id:editingId||Date.now(),type:formType,title:title||'体重记录',value:val,category:formType==='weight'?'体重':$('#category').value,date:$('#entryDate').value,created:editingId?(state.items.find(x=>x.id===editingId)?.created||Date.now()):Date.now(),done:editingId?(state.items.find(x=>x.id===editingId)?.done||false):false};if(editingId)state.items=state.items.map(x=>x.id===editingId?d:x);else state.items.push(d);$('#entryDialog').close();persist();toast(editingId?'已更新':'已保存')}
function editMenu(id){let x=state.items.find(x=>x.id==id);if(!x)return;let choice=prompt('输入 1 编辑，输入 2 删除','1');if(choice==='1')openEntry(x.type,x);if(choice==='2'&&confirm('确定删除这条记录吗？')){state.items=state.items.filter(x=>x.id!=id);persist();toast('已删除')}}
document.addEventListener('click',e=>{let toggle=e.target.closest('[data-toggle]');if(toggle){let x=state.items.find(x=>x.id==toggle.dataset.toggle);x.done=toggle.checked;persist();return}let edit=e.target.closest('[data-edit]');if(edit){editMenu(edit.dataset.edit);return}let type=e.target.closest('[data-type]');if(type)openEntry(type.dataset.type);let go=e.target.closest('[data-go]');if(go)show(go.dataset.go)})
$('#typeGrid').onclick=e=>{let b=e.target.closest('[data-form-type]');if(!b)return;formType=b.dataset.formType;$$('#typeGrid button').forEach(x=>x.classList.toggle('selected',x===b));updateForm()}
$('#entryForm').onsubmit=saveEntry;$('#addBtn').onclick=()=>openEntry();$('#closeDialog').onclick=$('#cancelDialog').onclick=()=>$('#entryDialog').close();$('#todoSearch').oninput=renderTodos;$('#todoFilters').onclick=e=>{let b=e.target.closest('button');if(!b)return;todoFilter=b.dataset.filter;$$('#todoFilters button').forEach(x=>x.classList.toggle('active',x===b));renderTodos()};$('#moneyFilters').onclick=e=>{let b=e.target.closest('button');if(!b)return;moneyFilter=b.dataset.filter;$$('#moneyFilters button').forEach(x=>x.classList.toggle('active',x===b));renderMoney()};function show(id){$$('.view').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'})}$$('.nav-btn').forEach(x=>x.onclick=()=>show(x.dataset.view));$('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='jaslife-backup-'+dateISO()+'.json';a.click();URL.revokeObjectURL(a.href);toast('备份已下载')};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;if(confirm('导入会合并同 ID 的记录，继续吗？')){let map=new Map(state.items.map(x=>[x.id,x]));d.items.forEach(x=>map.set(x.id,x));state.items=[...map.values()];persist();toast('已导入备份')}}catch{toast('这不是有效的 Jaslife 备份文件')}};r.readAsText(file)};$('#clearBtn').onclick=()=>{if(confirm('确定清空所有记录吗？此操作不可撤销。')){state={items:[]};persist();toast('记录已清空')}};let h=new Date().getHours();$('#greeting').textContent=(h<11?'早安':h<18?'午安':'晚上好')+'，Jasmyn';$('#dateText').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
